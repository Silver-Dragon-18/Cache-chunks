name: Build StasisPivot

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Host checks and pack builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run every host check
        run: ./scripts/check.sh

      - name: Upload packs
        uses: actions/upload-artifact@v4
        with:
          name: StasisPivot-packs
          path: |
            dist/StasisPivot.mcaddon
            dist/StasisPivot-BP.mcpack
            dist/StasisPivot-RP.mcpack
          if-no-files-found: error

  android:
    name: Native companion (arm64-v8a)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - name: Set up the Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build libstasis_pivot.so
        run: cmake --build build --config Release

      - name: Verify the library
        run: |
          file build/libstasis_pivot.so
          "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h build/libstasis_pivot.so | grep -E "Machine|Class"
          # The mod must export its registration symbol, or LeviLauncher sees a
          # mod with no entry point.
          "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
            -D --defined-only build/libstasis_pivot.so | grep PLGetModRegistration

      - name: Assemble the .levipack
        run: python3 tools/make_levipack.py build/libstasis_pivot.so --out out

      - name: Upload the levipack
        uses: actions/upload-artifact@v4
        with:
          name: StasisPivot-levipack
          path: out/*.levipack
          if-no-files-found: error
